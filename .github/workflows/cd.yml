name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/chat-platform

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Set image tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          echo "TAG=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Set Kubernetes context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Create namespace if not exists
        run: kubectl apply -f k8s/namespace.yaml

      - name: Apply secrets and configmaps
        run: |
          kubectl apply -f k8s/secrets/
          kubectl apply -f k8s/configmaps/

      - name: Deploy databases and RabbitMQ
        run: |
          kubectl apply -f k8s/databases/
          kubectl apply -f k8s/rabbitmq/

      - name: Wait for databases
        run: |
          kubectl -n chat-platform rollout status deployment/postgres --timeout=120s
          kubectl -n chat-platform rollout status deployment/mongodb --timeout=120s
          kubectl -n chat-platform rollout status deployment/redis --timeout=120s
          kubectl -n chat-platform rollout status deployment/rabbitmq --timeout=120s

      - name: Deploy application services
        run: |
          kubectl apply -f k8s/services/
          kubectl apply -f k8s/frontend/
          kubectl apply -f k8s/gateway/

      - name: Update image tags
        run: |
          TAG="${{ steps.tag.outputs.TAG }}"
          for svc in user-service chat-service message-service notification-service presence-service; do
            kubectl -n chat-platform set image deployment/$svc \
              $svc=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/$svc:$TAG
          done
          kubectl -n chat-platform set image deployment/frontend \
            frontend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:$TAG

      - name: Apply ingress and HPA
        run: |
          kubectl apply -f k8s/ingress/
          kubectl apply -f k8s/hpa/

      - name: Wait for rollout
        run: |
          for svc in user-service chat-service message-service notification-service presence-service frontend nginx-gateway; do
            kubectl -n chat-platform rollout status deployment/$svc --timeout=180s
          done

      - name: Verify deployment
        run: |
          echo "=== Pod Status ==="
          kubectl -n chat-platform get pods
          echo "=== Services ==="
          kubectl -n chat-platform get svc
          echo "=== Ingress ==="
          kubectl -n chat-platform get ingress
