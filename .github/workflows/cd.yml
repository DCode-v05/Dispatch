name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Trigger Render deploys
        env:
          USER_HOOK: ${{ secrets.RENDER_USER_HOOK }}
          CHAT_HOOK: ${{ secrets.RENDER_CHAT_HOOK }}
          MESSAGE_HOOK: ${{ secrets.RENDER_MESSAGE_HOOK }}
          NOTIF_HOOK: ${{ secrets.RENDER_NOTIF_HOOK }}
          PRESENCE_HOOK: ${{ secrets.RENDER_PRESENCE_HOOK }}
          FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_HOOK }}
        run: |
          set -e
          trigger() {
            local name=$1 url=$2
            if [ -z "$url" ]; then
              echo "::warning::No deploy hook for $name — skipping"
              return
            fi
            echo "Triggering deploy for $name"
            curl -fsS -X POST "$url" -o /dev/null
            echo "  -> done"
          }
          trigger "user-service"         "$USER_HOOK"
          trigger "chat-service"         "$CHAT_HOOK"
          trigger "message-service"      "$MESSAGE_HOOK"
          trigger "notification-service" "$NOTIF_HOOK"
          trigger "presence-service"     "$PRESENCE_HOOK"
          trigger "frontend"             "$FRONTEND_HOOK"

      - name: Summary
        run: |
          echo "### Render deploys triggered" >> "$GITHUB_STEP_SUMMARY"
          echo "Each service rebuilds independently. Check the Render dashboard for build status." >> "$GITHUB_STEP_SUMMARY"
