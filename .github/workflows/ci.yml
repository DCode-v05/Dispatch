name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/chat-platform

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chatadmin
          POSTGRES_PASSWORD: chatpass123
          POSTGRES_DB: chatplatform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatadmin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: chatadmin
          RABBITMQ_DEFAULT_PASS: chatpass123
        ports:
          - 5672:5672
    strategy:
      matrix:
        service:
          - frontend
          - services/user-service
          - services/chat-service
          - services/message-service
          - services/notification-service
          - services/presence-service
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: ${{ matrix.service }}
        run: npm run lint

      - name: Build (type-check + compile)
        working-directory: ${{ matrix.service }}
        run: npm run build

      - name: Run unit tests
        working-directory: ${{ matrix.service }}
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-must-be-at-least-32-chars-long
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: chatadmin
          POSTGRES_PASSWORD: chatpass123
          POSTGRES_DB: chatplatform
          MONGODB_URI: mongodb://localhost:27017/chatplatform
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ''
          RABBITMQ_URL: amqp://chatadmin:chatpass123@localhost:5672
        run: npm test -- --passWithNoTests

      - name: Audit dependencies (non-fatal)
        working-directory: ${{ matrix.service }}
        run: npm audit --audit-level=high --omit=dev || true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ strategy.job-index }}
          path: ${{ matrix.service }}/coverage/
          retention-days: 7
          if-no-files-found: ignore

  build-images:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: frontend
            context: ./frontend
            image_name: frontend
          - service: user-service
            context: ./services/user-service
            image_name: user-service
          - service: chat-service
            context: ./services/chat-service
            image_name: chat-service
          - service: message-service
            context: ./services/message-service
            image_name: message-service
          - service: notification-service
            context: ./services/notification-service
            image_name: notification-service
          - service: presence-service
            context: ./services/presence-service
            image_name: presence-service
          - service: gateway
            context: ./gateway
            image_name: gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image_name }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (non-fatal)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image_name }}:latest
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'
