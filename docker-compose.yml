services:
  # Databases
  postgres:
    image: postgres:16-alpine
    container_name: chat-postgres
    environment:
      POSTGRES_USER: chatadmin
      POSTGRES_PASSWORD: chatpass123
      POSTGRES_DB: chatplatform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatadmin -d chatplatform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat-network

  mongodb:
    image: mongo:7
    container_name: chat-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: chatadmin
      MONGO_INITDB_ROOT_PASSWORD: chatpass123
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat-network

  redis:
    image: redis:7-alpine
    container_name: chat-redis
    command: redis-server --requirepass chatpass123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "chatpass123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: chat-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: chatadmin
      RABBITMQ_DEFAULT_PASS: chatpass123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - chat-network

  # Microservices
  user-service:
    build:
      context: ./services/user-service
      target: production
    container_name: chat-user-service
    environment:
      PORT: "3000"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: chatadmin
      POSTGRES_PASSWORD: chatpass123
      POSTGRES_DB: chatplatform
      RABBITMQ_URL: amqp://chatadmin:chatpass123@rabbitmq:5672
      JWT_SECRET: dev-jwt-secret-change-in-prod
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - chat-network

  chat-service:
    build:
      context: ./services/chat-service
      target: production
    container_name: chat-chat-service
    environment:
      PORT: "3000"
      MONGODB_URI: mongodb://chatadmin:chatpass123@mongodb:27017/chatplatform?authSource=admin
      RABBITMQ_URL: amqp://chatadmin:chatpass123@rabbitmq:5672
      JWT_SECRET: dev-jwt-secret-change-in-prod
    ports:
      - "3002:3000"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - chat-network

  message-service:
    build:
      context: ./services/message-service
      target: production
    container_name: chat-message-service
    environment:
      PORT: "3000"
      MONGODB_URI: mongodb://chatadmin:chatpass123@mongodb:27017/chatplatform?authSource=admin
      RABBITMQ_URL: amqp://chatadmin:chatpass123@rabbitmq:5672
      JWT_SECRET: dev-jwt-secret-change-in-prod
    ports:
      - "3003:3000"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - chat-network

  notification-service:
    build:
      context: ./services/notification-service
      target: production
    container_name: chat-notification-service
    environment:
      PORT: "3000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: chatpass123
      RABBITMQ_URL: amqp://chatadmin:chatpass123@rabbitmq:5672
      JWT_SECRET: dev-jwt-secret-change-in-prod
    ports:
      - "3004:3000"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - chat-network

  presence-service:
    build:
      context: ./services/presence-service
      target: production
    container_name: chat-presence-service
    environment:
      PORT: "3000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: chatpass123
      RABBITMQ_URL: amqp://chatadmin:chatpass123@rabbitmq:5672
      JWT_SECRET: dev-jwt-secret-change-in-prod
    ports:
      - "3005:3000"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - chat-network

  frontend:
    build:
      context: ./frontend
      target: production
    container_name: chat-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:80/api
      NEXT_PUBLIC_WS_URL: http://localhost:80
    ports:
      - "3000:3000"
    networks:
      - chat-network

  gateway:
    build:
      context: ./gateway
    container_name: chat-gateway
    ports:
      - "80:80"
    depends_on:
      - user-service
      - chat-service
      - message-service
      - notification-service
      - presence-service
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - chat-network

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  rabbitmq_data:

networks:
  chat-network:
    driver: bridge
